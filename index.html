<script>
/* ==========================================================================
   26. 桌面端外壳 (DesktopShell)
   负责桌面图标渲染、任务栏、开始菜单、系统托盘
   ========================================================================== */
window.DesktopShell = {
  wm: null,

  init() {
    // 初始化窗口管理器
    const layer = document.getElementById('window-layer');
    const launchOverlay = document.getElementById('launch-overlay');
    this.wm = new WindowManager(layer, launchOverlay);

    // 窗口状态变化时，刷新任务栏
    this.wm.onStateChange = () => this.renderTaskbar();

    // 初始化桌面各区块
    this.renderDesktopIcons();
    this.renderTaskbar();
    this.renderTray();
    this.bindStartMenu();
  },

  /* ---------- 1. 桌面图标 ---------- */
  renderDesktopIcons() {
    const box = document.getElementById('desktop-icons');
    box.innerHTML = '';
    
    APPS.forEach(app => {
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.innerHTML = `
        <div class="app-icon" style="color:${app.color}">${icon(app.icon, 48)}</div>
        <span class="label">${app.title}</span>
      `;
      // 双击打开
      el.addEventListener('dblclick', () => Shell.openApp(app.id));
      box.appendChild(el);
    });
  },

  /* ---------- 2. 任务栏 ---------- */
  renderTaskbar() {
    const box = document.getElementById('taskbar-apps');
    if (!box) return;
    box.innerHTML = '';

    // 遍历当前打开的窗口
    this.wm.windows.forEach((w, id) => {
      const btn = document.createElement('button');
      btn.className = 'taskbar-app';
      btn.innerHTML = `<span style="color:${w.app.color};display:flex;align-items:center;">${icon(w.app.icon, 16)}</span><span>${w.app.title}</span>`;
      
      btn.addEventListener('click', () => {
        // 如果窗口最小化了，点击恢复；否则聚焦
        if (w.el.classList.contains('minimized')) {
          this.wm.focus(id);
        } else {
          // 如果已经聚焦，点击最小化（类似 Windows 行为）
          if (parseInt(w.el.style.zIndex) === this.wm.zIndexCounter) {
            this.wm.minimize(id);
          } else {
            this.wm.focus(id);
          }
        }
      });
      
      box.appendChild(btn);
    });
  },

  /* ---------- 3. 系统托盘（时间、电量） ---------- */
  renderTray() {
    const tray = document.getElementById('tray');
    if (!tray) return;

    const tick = () => {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      tray.innerHTML = `
        ${icon('wifi', 16)} 
        ${icon('battery-full', 16)} 
        <span style="font-weight:500;">${hh}:${mm}</span>
      `;
    };
    
    tick();
    setInterval(tick, 30000); // 每30秒更新一次
  },

  /* ---------- 4. 开始菜单 ---------- */
  bindStartMenu() {
    const btn = document.getElementById('start-btn');
    const menu = document.getElementById('start-menu');
    if (!btn || !menu) return;

    btn.innerHTML = icon('grid', 22);

    // 渲染菜单内容
    menu.innerHTML = `
      <h4>所有应用</h4>
      <div class="start-menu-grid"></div>
    `;
    const grid = menu.querySelector('.start-menu-grid');

    APPS.forEach(app => {
      const item = document.createElement('div');
      item.className = 'start-menu-item';
      item.innerHTML = `
        <span style="color:${app.color}">${icon(app.icon, 28)}</span>
        <span>${app.title}</span>
      `;
      item.addEventListener('click', () => {
        menu.classList.remove('open');
        Shell.openApp(app.id);
      });
      grid.appendChild(item);
    });

    // 点击按钮切换菜单
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });

    // 点击外部关闭菜单
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
      }
    });
  },

  /* ---------- 5. Shell 接口实现 ---------- */
  
  // 打开 App（包含启动动画）
  openApp(id) {
    const app = APPS.find(a => a.id === id);
    if (!app) return;
    
    // 如果开始菜单开着，先关掉
    const menu = document.getElementById('start-menu');
    if (menu) menu.classList.remove('open');
    
    this.wm.open(app);
  },

  // 关闭 App
  closeApp(id) {
    this.wm.close(id);
  },

  // 返回（桌面端无此概念）
  goBack() {},

  // 判断是否在运行
  isRunning(id) {
    return this.wm.windows.has(id);
  },

  // 刷新 App 内容
  refresh(id) {
    this.wm.refresh(id);
  },

  // 弹出通知 Toast
  notify(msg) {
    const layer = document.getElementById('toast-layer');
    if (!layer) return;

    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `${icon('check', 18)} <span>${msg}</span>`;
    layer.appendChild(t);
    
    // 3秒后移除
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(-20px)';
      setTimeout(() => t.remove(), 300);
    }, 3000);
  }
};
</script>
<script>
/* ==========================================================================
   27. 手机端外壳 (MobileShell)
   负责手机状态栏、桌面图标网格、底部 Dock、页面栈管理
   ========================================================================== */
window.MobileShell = {
  ps: null,

  init() {
    // 初始化页面栈
    const container = document.getElementById('page-stack');
    this.ps = new PageStack(container);

    // 初始化 UI 组件
    this.renderIcons();
    this.renderDock();
    this.startClock();
    this.renderStatusIcons();
  },

  /* ---------- 1. 桌面图标网格 ---------- */
  renderIcons() {
    const box = document.getElementById('mobile-icons');
    if (!box) return;
    box.innerHTML = '';

    APPS.forEach(app => {
      // 如果不想让某些 App 出现在手机桌面（比如设置），可以在这里过滤
      // 这里为了完整演示，全部展示
      const el = document.createElement('div');
      el.className = 'mobile-icon';
      el.innerHTML = `
        <div class="app-icon" style="color:${app.color}">${icon(app.icon, 52)}</div>
        <span class="label">${app.title}</span>
      `;
      
      // 点击图标直接推入页面栈
      el.addEventListener('click', () => Shell.openApp(app.id));
      box.appendChild(el);
    });
  },

  /* ---------- 2. 底部 Dock ---------- */
  renderDock() {
    const dock = document.getElementById('mobile-dock');
    if (!dock) return;
    dock.innerHTML = '';

    // 选取 4 个常用 App 放入 Dock
    const dockIds = ['train', 'wallet', 'orders', 'profile'];
    
    dockIds.forEach(id => {
      const app = APPS.find(a => a.id === id);
      if (!app) return;

      const el = document.createElement('div');
      el.className = 'mobile-icon';
      el.innerHTML = `
        <div class="app-icon" style="color:${app.color}">${icon(app.icon, 42)}</div>
        <span class="label">${app.title}</span>
      `;
      el.addEventListener('click', () => Shell.openApp(id));
      dock.appendChild(el);
    });
  },

  /* ---------- 3. 状态栏时间 ---------- */
  startClock() {
    const el = document.getElementById('mobile-time');
    if (!el) return;

    const tick = () => {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      el.textContent = `${hh}:${mm}`;
    };
    
    tick();
    setInterval(tick, 30000);
  },

  /* ---------- 4. 状态栏图标（WiFi、电量） ---------- */
  renderStatusIcons() {
    const el = document.getElementById('mobile-status-icons');
    if (!el) return;
    el.innerHTML = `
      ${icon('wifi', 18)}
      ${icon('battery-full', 18)}
    `;
  },

  /* ---------- 5. Shell 接口实现 ---------- */
  
  // 打开 App（推入页面栈）
  openApp(id) {
    const app = APPS.find(a => a.id === id);
    if (!app) return;
    
    this.ps.push(app);
  },

  // 关闭 App
  closeApp(id) {
    this.ps.close(id);
  },

  // 返回上一页（弹出栈顶）
  goBack() {
    this.ps.goBack();
  },

  // 判断 App 是否在栈中
  isRunning(id) {
    return this.ps.isRunning(id);
  },

  // 刷新 App 内容
  refresh(id) {
    this.ps.refresh(id);
  },

  // 弹出通知 Toast
  notify(msg) {
    const layer = document.getElementById('toast-layer');
    if (!layer) return;

    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<span>${msg}</span>`;
    layer.appendChild(t);
    
    // 2.6秒后移除
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(-20px)';
      setTimeout(() => t.remove(), 300);
    }, 2600);
  }
};
</script>
<script>
/* ==========================================================================
   28. 启动引导 (Bootstrapper)
   负责：注入图标库、初始化双端外壳、绑定设备切换、处理启动逻辑
   ========================================================================== */
(function boot() {
  // 1. 注入 SVG 图标符号
  injectIconSprite();

  // 2. 初始化双端外壳
  // 无论当前是什么设备，都先初始化好，方便随时切换
  DesktopShell.init();
  MobileShell.init();

  // 3. 根据当前设备模式，激活对应的 Shell 实现
  const isMobile = Device.mode === 'mobile';
  Shell.use(isMobile ? MobileShell : DesktopShell);

  // 4. 绑定设备切换按钮（演示用）
  const toggleBtn = document.getElementById('device-toggle');
  if (toggleBtn) {
    // 更新按钮图标
    const updateToggleIcon = () => {
      const currentMode = Device.mode;
      toggleBtn.innerHTML = icon(currentMode === 'mobile' ? 'monitor' : 'smartphone', 22);
      toggleBtn.title = currentMode === 'mobile' ? '切换到电脑视图' : '切换到手机视图';
    };
    
    updateToggleIcon();
    
    // 点击切换
    toggleBtn.addEventListener('click', () => {
      Device.toggle();
    });

    // 监听设备切换事件（Device.toggle 内部会派发）
    window.addEventListener('devicechange', (e) => {
      const newMode = e.detail; // 'mobile' 或 'desktop'
      
      // 更新 Shell 实现
      Shell.use(newMode === 'mobile' ? MobileShell : DesktopShell);
      
      // 更新按钮图标
      updateToggleIcon();
      
      // 提示用户
      Shell.notify(`已切换至${newMode === 'mobile' ? '手机' : '电脑'}视图`);
    });
  }

  // 5. 监听窗口大小变化，处理桌面端窗口越界问题
  let resizeTimer;
  window.addEventListener('resize', () => {
    if (Device.mode !== 'desktop') return;
    
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!DesktopShell.wm) return;
      
      DesktopShell.wm.windows.forEach((w, id) => {
        const el = w.el;
        if (!el || el.classList.contains('maximized')) return;
        
        // 防止窗口拖出屏幕
        const rect = el.getBoundingClientRect();
        let changed = false;
        
        if (rect.left > window.innerWidth - 200) {
          el.style.left = `${Math.max(0, window.innerWidth - 400)}px`;
          changed = true;
        }
        if (rect.top > window.innerHeight - 100) {
          el.style.top = `${Math.max(0, window.innerHeight - 300)}px`;
          changed = true;
        }
        
        if (changed) {
          // 如果发生位置修正，可以在这里做点啥，目前不需要
        }
      });
    }, 200);
  });

  // 6. 打印欢迎信息
  console.log(
    '%cTravelOS v2.0 %c\n' +
    '欢迎使用模拟操作系统！\n' +
    '当前设备模式: ' + Device.mode + '\n' +
    '云同步状态: ' + (Store.get('sync_code') ? '已配置' : '未配置') + '\n' +
    '数据存储: LocalStorage + Netlify Blobs',
    'color:#2563eb;font-size:16px;font-weight:bold;',
    'color:#64748b;font-size:12px;'
  );

  // 7. 如果之前配置过同步码，尝试静默同步一下
  // 注意：如果是第一次打开，localStorage 里没有同步码，不会触发
  if (Store.get('sync_code')) {
    setTimeout(async () => {
      try {
        await SyncEngine.autoSync();
        console.log('[Boot] 启动时自动同步完成');
      } catch (e) {
        console.warn('[Boot] 启动自动同步失败:', e.message);
      }
    }, 1500); // 延迟 1.5 秒，避免阻塞首屏渲染
  }

})();
</script>
