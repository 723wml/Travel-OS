<!DOCTYPE html>
<html lang="zh-CN" data-device="desktop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TravelOS - Netlify Edition</title>
<style>
/* ==========================================
   基础重置 & 全局变量
   ========================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --bg-glass: rgba(15, 23, 42, 0.85);
  --border-color: #e2e8f0;
  --text-main: #0f172a;
  --text-sub: #64748b;
}
[data-device="desktop"] #mobile-shell { display: none; }
[data-device="mobile"] #desktop-shell { display: none; }

/* ==========================================
   几何波浪壁纸 (模拟用户提供图片的玻璃质感)
   ========================================== */
.bg-wallpaper {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: #0f172a;
  overflow: hidden;
}

/* 基础波浪层 */
.wave-layer {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: linear-gradient(135deg, rgba(37,99,235,0.8) 0%, rgba(56,189,248,0.4) 50%, transparent 100%);
  border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
  animation: waveMove 20s linear infinite alternate;
  filter: blur(20px);
}

.wave-layer-2 {
  background: linear-gradient(225deg, rgba(30,58,138,0.9) 0%, rgba(14,165,233,0.5) 50%, transparent 100%);
  border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
  animation: waveMove2 25s linear infinite alternate;
  filter: blur(30px);
}

.wave-layer-3 {
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 60%);
  border-radius: 50%;
  animation: pulseGlow 10s ease-in-out infinite;
  mix-blend-mode: overlay;
}

@keyframes waveMove {
  0% { transform: rotate(0deg) translate(0, 0) scale(1); }
  100% { transform: rotate(10deg) translate(5%, 5%) scale(1.1); }
}
@keyframes waveMove2 {
  0% { transform: rotate(0deg) translate(0, 0) scale(1); }
  100% { transform: rotate(-15deg) translate(-5%, 10%) scale(1.2); }
}
@keyframes pulseGlow {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.2); opacity: 0.8; }
}

/* 玻璃反光质感覆盖 */
.glass-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.2) 100%);
  pointer-events: none;
}
</style>
</head>
<body>

<!-- 壁纸层 -->
<div class="bg-wallpaper">
  <div class="wave-layer"></div>
  <div class="wave-layer wave-layer-2"></div>
  <div class="wave-layer wave-layer-3"></div>
  <div class="glass-overlay"></div>
</div>
<style>
/* ==========================================
   桌面端布局 (Desktop Shell)
   ========================================== */
.desktop-shell {
  position: relative;
  width: 100%; height: 100%;
}
.desktop-icons {
  position: absolute;
  top: 30px; left: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 96px);
  gap: 16px;
  align-content: start;
  max-height: calc(100% - 120px);
  overflow: auto;
  padding: 10px;
}
.desktop-icon {
  width: 96px;
  padding: 12px 6px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  position: relative;
}
.desktop-icon:hover { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); }
.desktop-icon:active { transform: scale(0.95); }
.desktop-icon .app-icon { font-size: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
.desktop-icon .app-icon svg { width: 48px; height: 48px; }
.desktop-icon .label {
  font-size: 13px; text-align: center; line-height: 1.2;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  word-break: break-all;
  font-weight: 500;
}

/* 任务栏 */
.taskbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  z-index: 9000;
}
.start-btn {
  width: 40px; height: 40px;
  border: none; border-radius: 10px;
  background: transparent; color: #fff;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background 0.2s;
}
.start-btn:hover { background: rgba(255, 255, 255, 0.2); }
.taskbar-apps {
  flex: 1; display: flex; gap: 8px; overflow: hidden;
}
.taskbar-app {
  height: 38px; padding: 0 14px;
  border: none; border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
  transition: background 0.2s;
  max-width: 180px;
  white-space: nowrap;
  overflow: hidden;
}
.taskbar-app:hover { background: rgba(255, 255, 255, 0.25); }
.tray {
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; padding-right: 8px;
}

/* 开始菜单 */
.start-menu {
  position: absolute;
  left: 12px; bottom: 64px;
  width: 360px; max-height: 520px;
  overflow-y: auto;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
  display: none;
  color: #fff;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  z-index: 9500;
  animation: slideUp 0.2s ease-out;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.start-menu.open { display: block; }
.start-menu h4 { margin-bottom: 12px; font-size: 13px; color: #94a3b8; font-weight: 500; }
.start-menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.start-menu-item {
  padding: 12px 8px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12px; cursor: pointer; transition: background 0.15s;
}
.start-menu-item:hover { background: rgba(255, 255, 255, 0.15); }
.start-menu-item svg { width: 28px; height: 28px; }

/* ==========================================
   手机端布局 (Mobile Shell)
   ========================================== */
.mobile-shell {
  position: relative;
  width: 100%; height: 100dvh;
  color: #fff;
  overflow: hidden;
}
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0; height: 48px;
  padding: 0 24px;
  padding-top: env(safe-area-inset-top);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 14px; font-weight: 500;
  z-index: 10;
}
.mobile-desk {
  position: absolute; inset: 48px 0 0 0;
  display: flex; flex-direction: column;
  padding: 16px 20px 24px;
  overflow: auto;
}
.mobile-icons {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 20px 12px;
  align-content: start;
}
.mobile-icon {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; transition: transform 0.1s;
}
.mobile-icon:active { transform: scale(0.9); }
.mobile-icon .app-icon svg { width: 52px; height: 52px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
.mobile-icon .label { font-size: 12px; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.mobile-dock {
  height: 88px; border-radius: 28px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-around; align-items: center;
  padding: 0 12px;
  margin-top: auto;
  margin-bottom: env(safe-area-inset-bottom);
}
.mobile-dock .mobile-icon { width: 68px; }
.mobile-dock .mobile-icon .app-icon svg { width: 42px; height: 42px; }

/* ==========================================
   启动动画 (App Launching Animation)
   ========================================== */
.launch-overlay {
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.launch-overlay.active { opacity: 1; pointer-events: auto; }

.launch-container {
  position: relative;
  width: 120px; height: 120px;
  display: flex; justify-content: center; align-items: center;
}
.launch-icon-wrap {
  width: 70px; height: 70px;
  display: flex; justify-content: center; align-items: center;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 2;
  animation: iconFloat 1.5s ease-in-out infinite alternate;
}
@keyframes iconFloat {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-5px) scale(1.05); }
}
.launch-icon-wrap svg { width: 44px; height: 44px; }

.launch-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 4px solid transparent;
  z-index: 1;
}
.launch-ring::before, .launch-ring::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 4px solid transparent;
}
.launch-ring::before {
  border-top-color: #fff;
  border-right-color: rgba(255,255,255,0.5);
  animation: spin 1s linear infinite;
}
.launch-ring::after {
  border-bottom-color: rgba(255,255,255,0.2);
  border-left-color: rgba(255,255,255,0.2);
  animation: spin 2s linear infinite reverse;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

/* 画圈结束后的爆发效果 */
.launch-overlay.explode .launch-ring { display: none; }
.launch-overlay.explode .launch-icon-wrap {
  animation: expandPage 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes expandPage {
  0% { transform: scale(1); border-radius: 20px; opacity: 1; }
  100% { transform: scale(50); border-radius: 0; opacity: 0; }
}

/* 窗口外层容器（由动画结束后显现） */
.window-layer {
  position: absolute;
  inset: 0 0 52px 0;
  pointer-events: none;
}
.os-window {
  position: absolute;
  pointer-events: auto;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  display: flex; flex-direction: column;
  min-width: 360px; min-height: 300px;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.3s, transform 0.3s;
}
.os-window.visible { opacity: 1; transform: scale(1); }

/* 手机页面栈 */
.page-stack {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 100;
}
.page-stack > * { pointer-events: auto; }
.mobile-page {
  position: absolute;
  inset: 0;
  background: #f8fafc;
  color: #0f172a;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
  z-index: 101;
}
.mobile-page.active { transform: translateX(0); }
</style>
<style>
/* ==========================================
   App 通用组件 (Universal App UI)
   ========================================== */
.app {
  padding: 20px;
  height: 100%;
  overflow-y: auto;
  background: #f8fafc;
  color: var(--text-main);
}
.app h2 {
  font-size: 18px; font-weight: 700;
  margin-bottom: 16px;
  color: var(--text-main);
  display: flex; align-items: center; gap: 8px;
}
.app h3 {
  font-size: 15px; font-weight: 600;
  margin: 20px 0 10px;
  color: #334155;
}

/* 表单 */
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 13px;
  color: var(--text-sub); margin-bottom: 6px; font-weight: 500;
}
.field input, .field select {
  width: 100%; height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 14px; background: #fff;
  color: var(--text-main); outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

/* 按钮 */
.btn {
  height: 44px; padding: 0 20px;
  border: none; border-radius: 10px;
  background: var(--primary); color: #fff;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: var(--primary-hover); }
.btn:active { transform: scale(0.97); }
.btn.secondary { background: #e2e8f0; color: var(--text-main); }
.btn.secondary:hover { background: #cbd5e1; }
.btn.danger { background: #ef4444; }
.btn.danger:hover { background: #dc2626; }
.btn.block { width: 100%; }
.btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* 卡片 */
.card {
  background: #fff;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card.clickable { cursor: pointer; }
.card.clickable:hover {
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(37,99,235,0.08);
}
.card.selected {
  border-color: var(--primary);
  background: #eff6ff;
}
.card-title {
  font-weight: 600; font-size: 15px;
  color: var(--text-main); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.card-sub { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

/* 行 / 标签 / 价格 */
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; color: #334155; gap: 10px; }
.row .muted { color: #94a3b8; font-size: 13px; }
.price { color: #dc2626; font-weight: 700; font-size: 16px; }
.divider { height: 1px; background: var(--border-color); margin: 12px 0; }
.tag {
  display: inline-block; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; background: #dbeafe; color: #1d4ed8;
}
.tag.gray { background: #f1f5f9; color: #475569; }
.tag.green { background: #dcfce7; color: #15803d; }
.tag.red { background: #fee2e2; color: #b91c1c; }

/* 空状态 */
.empty {
  text-align: center; padding: 60px 20px;
  color: #94a3b8; font-size: 14px; line-height: 1.8;
}
.empty svg { margin-bottom: 12px; opacity: 0.5; }

/* 头部栏 */
.header-bar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.header-bar .title { font-weight: 700; font-size: 16px; color: var(--text-main); }
.header-bar .sub { font-size: 13px; color: var(--text-sub); margin-top: 2px; }

/* ==========================================
   钱包卡包组件 (Wallet Cards)
   ========================================== */
.bank-card {
  position: relative;
  width: 100%; height: 180px;
  border-radius: 16px;
  padding: 20px;
  color: #fff;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  overflow: hidden;
  margin-bottom: 14px;
}
/* 银行卡背景渐变 */
.bank-card.bg-0 { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
.bank-card.bg-1 { background: linear-gradient(135deg, #4c1d95, #7c3aed); }
.bank-card.bg-2 { background: linear-gradient(135deg, #064e3b, #059669); }
.bank-card.bg-3 { background: linear-gradient(135deg, #7f1d1d, #dc2626); }
.bank-card.bg-4 { background: linear-gradient(135deg, #0f172a, #475569); }

.bank-card::after {
  content: ''; position: absolute;
  top: -50%; right: -20%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.bank-card-top { display: flex; justify-content: space-between; align-items: flex-start; z-index: 1; }
.bank-card-bank { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
.bank-card-network { font-size: 12px; font-weight: 800; font-style: italic; opacity: 0.8; text-transform: uppercase; }
.bank-card-chip {
  width: 36px; height: 26px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: 6px; position: relative; margin-top: 10px;
}
.bank-card-chip::before {
  content: ''; position: absolute; inset: 2px;
  border: 1px solid rgba(0,0,0,0.2); border-radius: 4px;
}
.bank-card-number {
  font-size: 20px; font-weight: 600; letter-spacing: 2px;
  font-family: monospace; z-index: 1;
}
.bank-card-bottom { display: flex; justify-content: space-between; align-items: flex-end; z-index: 1; }
.bank-card-bottom .label { font-size: 10px; opacity: 0.7; text-transform: uppercase; margin-bottom: 2px; }
.bank-card-bottom .value { font-size: 14px; font-weight: 500; }

/* 卡包列表项 (用于点进去查看/编辑) */
.bank-card-item {
  background: #fff; border: 1px solid var(--border-color);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: border-color 0.2s;
}
.bank-card-item:hover { border-color: var(--primary); }
.bank-card-item-left { display: flex; align-items: center; gap: 12px; }
.bank-card-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: #eff6ff; color: var(--primary);
  display: grid; place-items: center;
}
.bank-card-item-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
.bank-card-item-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

/* ==========================================
   Toast 提示
   ========================================== */
.toast-layer {
  position: fixed;
  right: 20px; bottom: 80px;
  z-index: 999998;
  display: flex; flex-direction: column; gap: 10px;
  align-items: flex-end;
  pointer-events: none;
}
.toast {
  background: rgba(15, 23, 42, 0.95);
  color: #fff;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: toastIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  max-width: 300px;
  display: flex; align-items: center; gap: 8px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
[data-device="mobile"] .toast-layer {
  left: 16px; right: 16px; bottom: auto; top: 60px; align-items: stretch;
}
[data-device="mobile"] .toast { max-width: none; }

/* ==========================================
   模态框 (Modal)
   ========================================== */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 999999;
  display: grid; place-items: center;
  padding: 20px;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  background: #fff; border-radius: 16px;
  padding: 24px; width: 100%; max-width: 440px;
  max-height: 85vh; overflow-y: auto;
  color: var(--text-main);
  box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  animation: modalIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-box h3 {
  margin: 0 0 20px; font-size: 18px; font-weight: 700;
  color: var(--text-main);
}

/* 城市选择器 */
.city-picker { position: relative; }
.city-picker-input {
  width: 100%; height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 14px; background: #fff; color: var(--text-main);
  outline: none; cursor: pointer;
  transition: border-color 0.2s;
}
.city-picker-input:focus { border-color: var(--primary); }
.city-picker-panel {
  position: absolute; top: 100%; left: 0; right: 0;
  z-index: 100; background: #fff;
  border: 1px solid var(--border-color);
  border-radius: 10px; margin-top: 6px;
  max-height: 320px; overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
.city-picker-search {
  width: 100%; height: 40px;
  padding: 0 14px; border: none;
  border-bottom: 1px solid var(--border-color);
  font-size: 14px; outline: none;
  position: sticky; top: 0; background: #fff; z-index: 2;
}
.city-picker-group {
  padding: 8px 14px; font-size: 12px;
  color: #94a3b8; background: #f8fafc;
  position: sticky; top: 40px; z-index: 1;
}
.city-picker-item {

/* ==========================================================================
   2. 设备识别 & 全局状态
   ========================================================================== */
(function initDevice() {
  const KEY = 'travelos:device_mode';
  function detect() {
    const ua = navigator.userAgent;
    const hasTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
    const shortSide = Math.min(screen.width, screen.height);
    const isIPadOS = /Macintosh/.test(ua) && hasTouch;
    const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
    
    if (isMobileUA || isIPadOS) return 'mobile';
    if (hasTouch && shortSide < 820) return 'mobile';
    return 'desktop';
  }
  
  const saved = localStorage.getItem(KEY);
  const mode = saved || detect();
  document.documentElement.dataset.device = mode;
  
  window.Device = {
    mode,
    set(newMode) {
      localStorage.setItem(KEY, newMode);
      document.documentElement.dataset.device = newMode;
      this.mode = newMode;
      window.dispatchEvent(new CustomEvent('devicechange', { detail: newMode }));
    },
    toggle() {
      this.set(this.mode === 'mobile' ? 'desktop' : 'mobile');
    }
  };
})();

/* ==========================================================================
   3. 本地存储 (LocalStorage 封装)
   ========================================================================== */
window.Store = {
  ns: 'travelos:',
  get(key, fallback = null) {
    try {
      const v = localStorage.getItem(this.ns + key);
      if (v === null) return fallback;
      return JSON.parse(v);
    } catch (e) {
      console.warn('Store.get error:', e);
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(this.ns + key, JSON.stringify(value));
    } catch (e) {
      console.warn('Store.set error:', e);
    }
  },
  remove(key) {
    localStorage.removeItem(this.ns + key);
  },
  clearAll() {
    const keys = ['orders', 'messages', 'balance', 'passengers', 'notes', 'profile', 'cards', 'sync_code'];
    keys.forEach(k => this.remove(k));
  }
};

<script>
/* ==========================================================================
   4. 云端同步引擎 (Netlify Blobs 接口封装)
   用于跨设备同步订单、钱包、银行卡等数据。基于 Netlify Functions。
   ========================================================================== */
window.SyncEngine = {
  // Netlify Functions 接口路径
  apiEndpoint: '/.netlify/functions/sync',
  
  // 获取本地存储的同步码
  getSyncCode() {
    return Store.get('sync_code', '');
  },
  
  // 设置并保存同步码
  setSyncCode(code) {
    if (!code || !/^[A-Za-z0-9]{4,20}$/.test(code)) {
      throw new Error('同步码必须是 4-20 位字母或数字');
    }
    Store.set('sync_code', code);
    return true;
  },
  
  // 清除同步码
  clearSyncCode() {
    Store.remove('sync_code');
  },

  // 打包当前所有需要同步的数据
  packData() {
    return {
      orders: Store.get('orders', []),
      messages: Store.get('messages', []),
      balance: Store.get('balance', 5000),
      cards: Store.get('cards', []),
      passengers: Store.get('passengers', []),
      profile: Store.get('profile', { nickname: '旅行者', phone: '13800138000' }),
      updatedAt: Date.now()
    };
  },

  // 解包云端数据到本地存储
  unpackData(data) {
    if (!data) return false;
    if (data.orders !== undefined) Store.set('orders', data.orders);
    if (data.messages !== undefined) Store.set('messages', data.messages);
    if (data.balance !== undefined) Store.set('balance', data.balance);
    if (data.cards !== undefined) Store.set('cards', data.cards);
    if (data.passengers !== undefined) Store.set('passengers', data.passengers);
    if (data.profile !== undefined) Store.set('profile', data.profile);
    return true;
  },

  // 推送到云端
  async pushToCloud() {
    const code = this.getSyncCode();
    if (!code) throw new Error('未设置同步码');
    
    const payload = this.packData();
    
    try {
      const res = await fetch(`${this.apiEndpoint}?action=push&code=${encodeURIComponent(code)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || '网络请求失败');
      }
      
      return await res.json();
    } catch (e) {
      console.error('[SyncEngine] Push failed:', e);
      throw new Error(`同步失败: ${e.message}`);
    }
  },

  // 从云端拉取
  async pullFromCloud(overrideCode = null) {
    const code = overrideCode || this.getSyncCode();
    if (!code) throw new Error('未设置同步码');
    
    try {
      const res = await fetch(`${this.apiEndpoint}?action=pull&code=${encodeURIComponent(code)}`);
      
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || '网络请求失败');
      }
      
      const data = await res.json();
      
      if (!data || Object.keys(data).length === 0) {
        throw new Error('云端暂无数据');
      }
      
      this.unpackData(data);
      
      if (overrideCode) {
        this.setSyncCode(overrideCode);
      }
      
      return data;
    } catch (e) {
      console.error('[SyncEngine] Pull failed:', e);
      throw new Error(`拉取失败: ${e.message}`);
    }
  },

  // 静默同步（用于后台自动保存）
  async autoSync() {
    const code = this.getSyncCode();
    if (!code) return; // 没设置同步码就不自动同步
    try {
      await this.pushToCloud();
      console.log('[SyncEngine] Auto-sync completed');
    } catch (e) {
      console.warn('[SyncEngine] Auto-sync failed silently:', e.message);
    }
  }
};

// 提供全局快捷方法，方便各个 App 在修改数据后调用
window.maybeAutoSync = function() {
  // 使用 setTimeout 防抖，避免频繁请求
  if (window.__syncTimer) clearTimeout(window.__syncTimer);
  window.__syncTimer = setTimeout(() => {
    SyncEngine.autoSync();
  }, 2000); // 数据变更后 2 秒推送到云端
};


/* ==========================================================================
   5. 窗口管理器 (WindowManager) - 包含电脑端 App 启动动画
   ========================================================================== */
class WindowManager {
  constructor(layerElement, launchOverlayElement) {
    this.layer = layerElement;
    this.launchOverlay = launchOverlayElement;
    this.zIndexCounter = 100;
    this.windows = new Map();
    this.onStateChange = null;
    this.isAnimating = false;
  }

  // 触发启动动画，动画结束后再真正创建窗口
  triggerLaunchAnimation(app, callback) {
    if (!this.launchOverlay || this.isAnimating) {
      callback();
      return;
    }
    
    this.isAnimating = true;
    const iconWrap = document.getElementById('launch-icon-wrap');
    
    // 1. 设置图标颜色
    iconWrap.innerHTML = `<span style="color:${app.color}">${icon(app.icon, 44)}</span>`;
    
    // 2. 显示遮罩层并播动画
    this.launchOverlay.classList.remove('explode');
    this.launchOverlay.classList.add('active');
    
    // 3. 等待 1.2 秒（画圈动画），然后触发爆发效果
    setTimeout(() => {
      this.launchOverlay.classList.add('explode');
      
      // 4. 动画扩散的同时，在背景创建窗口（此时窗口是 opacity:0 的）
      callback();
      
      // 5. 等待扩散动画结束，清理状态
      setTimeout(() => {
        this.launchOverlay.classList.remove('active', 'explode');
        iconWrap.innerHTML = '';
        this.isAnimating = false;
        
        // 6. 显示刚创建的窗口
        const winData = this.windows.get(app.id);
        if (winData && winData.el) {
          winData.el.classList.add('visible');
        }
      }, 400); // 与 CSS 中的 expandPage 动画时长一致
    }, 1200);
  }

  // 打开 App 窗口
  open(app) {
    // 如果窗口已存在，直接聚焦
    if (this.windows.has(app.id)) {
      this.focus(app.id);
      return;
    }

    // 触发启动动画，动画结束后再执行真正的渲染
    this.triggerLaunchAnimation(app, () => {
      this._createWindowDOM(app);
    });
  }

  // 内部方法：创建窗口 DOM 结构
  _createWindowDOM(app) {
    const win = document.createElement('div');
    win.className = 'os-window';
    win.dataset.appId = app.id;
    
    // 初始位置：居中偏左上
    const w = 960, h = 640;
    const left = Math.max(20, (window.innerWidth - w) / 2 + (Math.random() * 40 - 20));
    const top = Math.max(20, (window.innerHeight - h) / 2 + (Math.random() * 40 - 20));
    
    win.style.left = `${left}px`;
    win.style.top = `${top}px`;
    win.style.width = `${w}px`;
    win.style.height = `${h}px`;

    // 标题栏
    const titlebar = document.createElement('div');
    titlebar.className = 'window-titlebar';
    titlebar.innerHTML = `
      <span style="color:${app.color};display:flex;align-items:center;">${icon(app.icon, 18)}</span>
      <span class="title" style="margin-left:8px;">${app.title}</span>
      <div class="window-controls">
        <button data-act="min" title="最小化">${icon('minus', 16)}</button>
        <button data-act="max" title="最大化">${icon('square', 14)}</button>
        <button data-act="close" title="关闭">${icon('x', 16)}</button>
      </div>
    `;

    // 内容区
    const body = document.createElement('div');
    body.className = 'window-body';
    // 渲染 App 内容
    try {
      const content = app.render();
      body.appendChild(content);
    } catch (e) {
      body.innerHTML = `<div style="padding:20px;color:red;">App 渲染出错: ${e.message}</div>`;
      console.error(e);
    }

    win.appendChild(titlebar);
    win.appendChild(body);
    this.layer.appendChild(win);

    this.windows.set(app.id, { el: win, app, body });
    this.focus(app.id);
    this.bindDrag(win);
    this.bindControls(win, app.id);
    this.notifyStateChange();
  }

  // 聚焦窗口（置顶）
  focus(id) {
    const winData = this.windows.get(id);
    if (!winData) return;
    
    winData.el.style.zIndex = ++this.zIndexCounter;
    winData.el.classList.remove('minimized');
    this.notifyStateChange();
  }

  // 关闭窗口
  close(id) {
    const winData = this.windows.get(id);
    if (!winData) return;
    
    // 添加关闭动画
    winData.el.style.transform = 'scale(0.9)';
    winData.el.style.opacity = '0';
    
    setTimeout(() => {
      winData.el.remove();
      this.windows.delete(id);
      this.notifyStateChange();
    }, 200);
  }

  // 最小化
  minimize(id) {
    const winData = this.windows.get(id);
    if (!winData) return;
    winData.el.classList.add('minimized');
    this.notifyStateChange();
  }

  // 刷新窗口内容（当 App 内部状态改变时调用）
  refresh(id) {
    const winData = this.windows.get(id);
    if (!winData) return;
    
    const scrollTop = winData.body.scrollTop;
    winData.body.innerHTML = '';
    try {
      const content = winData.app.render();
      winData.body.appendChild(content);
    } catch (e) {
      winData.body.innerHTML = `<div style="padding:20px;color:red;">刷新出错: ${e.message}</div>`;
    }
    winData.body.scrollTop = scrollTop;
  }

  notifyStateChange() {
    if (this.onStateChange) this.onStateChange();
  }

  // 拖拽逻辑
  bindDrag(win) {
    const bar = win.querySelector('.window-titlebar');
    let startX = 0, startY = 0, initialLeft = 0, initialTop = 0, isDragging = false;

    const onStart = (e) => {
      if (e.target.closest('.window-controls')) return; // 点击按钮不触发拖拽
      if (win.classList.contains('maximized')) return; // 最大化时不允许拖拽
      
      isDragging = true;
      const p = e.touches ? e.touches[0] : e;
      startX = p.clientX;
      startY = p.clientY;
      initialLeft = win.offsetLeft;
      initialTop = win.offsetTop;
      
      this.focus(win.dataset.appId);
      win.style.transition = 'none'; // 拖拽时禁用过渡动画
    };

    const onMove = (e) => {
      if (!isDragging) return;
      const p = e.touches ? e.touches[0] : e;
      
      let newLeft = initialLeft + (p.clientX - startX);
      let newTop = initialTop + (p.clientY - startY);
      
      // 边界限制（防止拖出屏幕顶部或左侧太远）
      newLeft = Math.max(-win.offsetWidth + 100, Math.min(window.innerWidth - 100, newLeft));
      newTop = Math.max(0, Math.min(window.innerHeight - 100, newTop));
      
      win.style.left = `${newLeft}px`;
      win.style.top = `${newTop}px`;
    };

    const onEnd = () => {
      if (isDragging) {
        isDragging = false;
        win.style.transition = 'opacity 0.3s, transform 0.3s'; // 恢复过渡
      }
    };

    bar.addEventListener('mousedown', onStart);
    bar.addEventListener('touchstart', onStart, { passive: true });
    
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);
  }

  // 窗口按钮控制
  bindControls(win, id) {
    win.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        
        if (act === 'close') {
          this.close(id);
        } else if (act === 'min') {
          this.minimize(id);
        } else if (act === 'max') {
          win.classList.toggle('maximized');
          if (win.classList.contains('maximized')) {
            win.dataset.oldStyle = JSON.stringify({
              left: win.style.left, top: win.style.top,
              width: win.style.width, height: win.style.height
            });
            win.style.left = '0';
            win.style.top = '0';
            win.style.width = '100%';
            win.style.height = 'calc(100% - 52px)'; // 减去任务栏高度
          } else {
            const old = JSON.parse(win.dataset.oldStyle || '{}');
            win.style.left = old.left || '100px';
            win.style.top = old.top || '100px';
            win.style.width = old.width || '960px';
            win.style.height = old.height || '640px';
          }
        }
      });
    });
  }
}
</script>
<script>
/* ==========================================================================
   6. 手机端页面栈管理器 (PageStack)
   模拟手机 App 的全屏页面推入与返回（Push / Pop）
   ========================================================================== */
class PageStack {
  constructor(containerElement) {
    this.container = containerElement;
    this.stack = []; // 存储 { appId, el }
  }

  // 推入一个新的 App 页面
  push(app) {
    // 如果当前栈顶已经是这个 App，就不重复推入
    if (this.stack.length > 0 && this.stack[this.stack.length - 1].appId === app.id) {
      return;
    }

    const page = document.createElement('div');
    page.className = 'mobile-page';
    page.dataset.appId = app.id;

    // 顶部导航栏
    const appbar = document.createElement('div');
    appbar.className = 'mobile-appbar';
    
    // 返回按钮
    const backBtn = document.createElement('button');
    backBtn.className = 'back';
    backBtn.innerHTML = icon('arrow-left', 22);
    backBtn.addEventListener('click', () => this.pop());
    
    // 标题
    const title = document.createElement('span');
    title.textContent = app.title;
    title.style.fontWeight = '600';

    appbar.appendChild(backBtn);
    appbar.appendChild(title);

    // 页面内容区
    const body = document.createElement('div');
    body.className = 'mobile-app-body';
    try {
      body.appendChild(app.render());
    } catch (e) {
      body.innerHTML = `<div style="padding:20px;color:red;">渲染出错: ${e.message}</div>`;
      console.error(e);
    }

    page.appendChild(appbar);
    page.appendChild(body);
    this.container.appendChild(page);
    
    this.stack.push({ appId: app.id, el: page });

    // 触发进入动画
    requestAnimationFrame(() => {
      page.classList.add('active');
    });
  }

  // 弹出栈顶页面（返回）
  pop() {
    if (this.stack.length === 0) return;
    
    const top = this.stack.pop();
    top.el.classList.remove('active');
    
    // 等待动画结束后移除 DOM
    setTimeout(() => {
      top.el.remove();
    }, 300); // 与 CSS transition 时长保持一致
  }

  // 关闭指定的 App（如果它在栈中）
  close(appId) {
    const index = this.stack.findIndex(item => item.appId === appId);
    if (index === -1) return;
    
    // 如果关闭的不是栈顶，需要把上面的也一起关掉
    while (this.stack.length > index) {
      this.pop();
    }
  }

  // 刷新指定 App 的内容
  refresh(appId) {
    const item = this.stack.find(s => s.appId === appId);
    if (!item) return;
    
    const app = window.APPS.find(a => a.id === appId);
    if (!app) return;
    
    const body = item.el.querySelector('.mobile-app-body');
    if (body) {
      const scrollTop = body.scrollTop;
      body.innerHTML = '';
      try {
        body.appendChild(app.render());
      } catch (e) {
        body.innerHTML = `<div style="padding:20px;color:red;">刷新出错: ${e.message}</div>`;
      }
      body.scrollTop = scrollTop;
    }
  }

  // 判断某个 App 是否在栈中
  isRunning(appId) {
    return this.stack.some(s => s.appId === appId);
  }

  // 返回（对外暴露）
  goBack() {
    this.pop();
  }
}

/* ==========================================================================
   7. 全局 Shell 统一接口 (Shell API)
   用来屏蔽桌面端和手机端的差异，App 内部统一调用 Shell 的方法
   ========================================================================== */
window.Shell = {
  _impl: null, // 实际执行者：DesktopShell 或 MobileShell

  // 初始化时注入具体实现
  use(impl) {
    this._impl = impl;
  },

  // 打开 App
  openApp(appId) {
    if (this._impl) this._impl.openApp(appId);
  },

  // 关闭 App
  closeApp(appId) {
    if (this._impl) this._impl.closeApp(appId);
  },

  // 返回上一级（主要针对手机端）
  goBack() {
    if (this._impl && this._impl.goBack) this._impl.goBack();
  },

  // 弹出全局通知 (Toast)
  notify(msg) {
    if (this._impl && this._impl.notify) {
      this._impl.notify(msg);
    } else {
      // Fallback，如果 _impl 未初始化时的简易提示
      console.log('[Notify]', msg);
    }
  },

  // 判断 App 是否运行中
  isRunning(appId) {
    return this._impl ? this._impl.isRunning(appId) : false;
  },

  // 刷新 App 内容
  refresh(appId) {
    if (this._impl && this._impl.refresh) this._impl.refresh(appId);
  }
};
</script>

  const map = {};

    const trimmed = line.trim();

    const city = trimmed.slice(0, idx).trim();
    const stations = trimmed.slice(idx + 1).split('/').map(s => s.trim()).filter(Boolean);
    
    if (city && stations.length) {
      map[city] = stations;
    }
  });
  return map;
}

// 工具函数：生成随机整数 [min, max]
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
// 工具函数：Hash 算法
function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
// 时间补齐
function pad(n) { return String(n).padStart(2, '0'); }
// 获取今天的日期字符串 YYYY-MM-DD
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// 根据基础时间和增加的分钟数，计算到达时间
function addMinutes(hhmm, mins) {
  const [h, m] = hhmm.split(':').map(Number);
  const total = (h * 60 + m + mins) % (24 * 60);
  return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;
}
// 将分钟转为“X小时Y分”
function durText(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}小时${m}分` : `${h}小时`;
}
// 生成发车/起飞时间
function makeTime(seed, idx, base = 6, span = 15) {
  const h = base + ((seed + idx * 7) % span);
  const m = [0, 10, 15, 20, 30, 40, 45, 50][(seed + idx * 3) % 8];
  return `${pad(h)}:${pad(m)}`;
}

/* ---------- 火车票生成器 (RailWayPass) ---------- */
function genTrains(fromStation, toStation) {
  const fromCity = findCityByStation(fromStation) || fromStation;
  const toCity = findCityByStation(toStation) || toStation;
  
  const rf = cityRegion(fromCity);
  const rt = cityRegion(toCity);
  const isIntl = rf === 'intl' || rt === 'intl';
  const isHkmo = rf === 'hkmo' || rt === 'hkmo';
  
  const seed = hash(fromStation + '|' + toStation);
  
  // 价格与时长基数
  const basePrice = isIntl ? 1200 : (isHkmo ? 480 : 220);
  const durBase = isIntl ? 900 : (isHkmo ? 240 : 120);
  
  // 车型配置：高铁、动车、普快
  const types = [
    { prefix: 'G', name: '高铁', factor: 1.0 },
    { prefix: 'G', name: '高铁', factor: 1.1 },
    { prefix: 'D', name: '动车', factor: 0.85 },
    { prefix: 'D', name: '动车', factor: 0.9 },
    { prefix: 'K', name: '普快', factor: 0.6 }
  ];
  
  const list = [];
  for (let i = 0; i < 6; i++) {
    const type = types[i % types.length];
    const s = seed + i * 37;
    
    const dep = makeTime(s, i, 6, 14);
    // 普快耗时更长
    const dur = Math.max(45, Math.round((durBase + (s % 160) - 60) * (type.prefix === 'K' ? 1.8 : 1)));
    const arr = addMinutes(dep, dur);
    
    // 二等座/硬座价格
    const p2 = Math.round((basePrice + (s % 220)) * type.factor);
    
    // 座位选项
    const options = [
      { name: (type.prefix === 'G' || type.prefix === 'D') ? '二等座' : '硬座', price: p2, left: 5 + (s % 30) },
      { name: (type.prefix === 'G' || type.prefix === 'D') ? '一等座' : '硬卧', price: Math.round(p2 * 1.7), left: (s % 15) },
      { name: '商务座', price: Math.round(p2 * 3.2), left: (s % 6) }
    ];

    list.push({
      no: `${type.prefix}${100 + i * 3 + (s % 20)}`,
      typeName: type.name,
      from: fromStation,
      to: toStation,
      dep,
      arr,
      dur,
      options
    });
  }
  return list;
}

/* ---------- 机票生成器 (FLYTrip) ---------- */
function genFlights(fromAirport, toAirport) {
  const fromCity = findCityByAirport(fromAirport) || fromAirport;
  const toCity = findCityByAirport(toAirport) || toAirport;
  
  const rf = cityRegion(fromCity);
  const rt = cityRegion(toCity);
  const isIntl = rf === 'intl' || rt === 'intl';
  const isHkmo = rf === 'hkmo' || rt === 'hkmo';
  
  const seed = hash(fromAirport + '|' + toAirport);
  
  const basePrice = isIntl ? 2800 : (isHkmo ? 1200 : 650);
  const durBase = isIntl ? 720 : (isHkmo ? 200 : 140);
  
  const airlines = [
    { name: '国航', code: 'CA' }, { name: '东航', code: 'MU' },
    { name: '南航', code: 'CZ' }, { name: '海航', code: 'HU' },
    { name: '川航', code: '3U' }, { name: '厦航', code: 'MF' },
    { name: '深航', code: 'ZH' }, { name: '吉祥', code: 'HO' }
  ];
  
  const list = [];
  for (let i = 0; i < 8; i++) {
    const air = airlines[i % airlines.length];
    const s = seed + i * 53;
    
    const dep = makeTime(s, i, 6, 15);
    const dur = Math.max(60, durBase + (s % 120) - 40);
    const arr = addMinutes(dep, dur);
    
    const p = basePrice + (s % 800);
    
    const options = [
      { name: '经济舱', price: p, left: 9 + (s % 40) },
      { name: '超级经济舱', price: Math.round(p * 1.6), left: 4 + (s % 12) },
      { name: '商务舱', price: Math.round(p * 3.4), left: 1 + (s % 6) },
      { name: '头等舱', price: Math.round(p * 4.8), left: (s % 3) }
    ];

    list.push({
      no: `${air.code}${1000 + (s % 8000)}`,
      airline: air.name,
      from: fromAirport,
      to: toAirport,
      dep,
      arr,
      dur,
      options
    });
  }
  return list;
}

<script>
/* ==========================================================================
   13. 城市/车站/机场选择器 (City Picker Component)
   支持按城市、车站、机场三种模式选择，带搜索和区域分组。
   ========================================================================== */
function openCityPicker(initialValue, mode, onPick) {
  // mode: 'station' (火车站) | 'airport' (机场) | 'city' (纯城市)
  
  // 根据模式决定数据源和分组
  let dataMap, groups;
  
  if (mode === 'station') {
    dataMap = ALL_CN_STATIONS;
    groups = [
      { label: '国内', cities: CN_CITIES }
    ];
  } else if (mode === 'airport') {
    dataMap = ALL_AIRPORTS;
    groups = [
      { label: '国内', cities: Object.keys(ALL_AIRPORTS_CN) },
      { label: '港澳台', cities: HKMO_CITIES },
      { label: '国际', cities: INTL_CITIES }
    ];
  } else {
    // city 模式，合并所有城市
    dataMap = {};
    DOMESTIC_CITIES.forEach(c => dataMap[c] = [c]);
    HKMO_CITIES.forEach(c => dataMap[c] = [c]);
    INTL_CITIES.forEach(c => dataMap[c] = [c]);
    
    groups = [
      { label: '国内', cities: DOMESTIC_CITIES },
      { label: '港澳台', cities: HKMO_CITIES },
      { label: '国际', cities: INTL_CITIES }
    ];
  }

  const wrap = document.createElement('div');
  wrap.className = 'city-picker';
  
  const input = document.createElement('input');
  input.className = 'city-picker-input';
  input.value = initialValue || '';
  input.readOnly = true;
  input.placeholder = mode === 'station' ? '选择车站' : mode === 'airport' ? '选择机场' : '选择城市';
  wrap.appendChild(input);

  const panel = document.createElement('div');
  panel.className = 'city-picker-panel';
  panel.style.display = 'none';
  
  const search = document.createElement('input');
  search.className = 'city-picker-search';
  search.placeholder = '输入关键词搜索...';
  panel.appendChild(search);

  const listBox = document.createElement('div');
  panel.appendChild(listBox);

  // 重建列表（带搜索过滤）
  function rebuild(keyword) {
    listBox.innerHTML = '';
    const kw = (keyword || '').trim().toLowerCase();
    let hasMatch = false;

    groups.forEach(g => {
      // 找到匹配的城市
      const matchedCities = g.cities.filter(city => {
        if (!kw) return true;
        if (city.toLowerCase().includes(kw)) return true;
        const arr = dataMap[city] || [];
        return arr.some(x => x.toLowerCase().includes(kw));
      });

      if (!matchedCities.length) return;

      // 渲染分组标题
      const gh = document.createElement('div');
      gh.className = 'city-picker-group';
      gh.textContent = g.label;
      listBox.appendChild(gh);

      // 渲染城市下的项目（车站、机场或城市本身）
      matchedCities.forEach(city => {
        const items = dataMap[city] || [city];
        items.forEach(item => {
          // 如果是搜索状态，且城市名和项目名都不包含关键词，则跳过
          if (kw && !city.toLowerCase().includes(kw) && !item.toLowerCase().includes(kw)) return;
          
          hasMatch = true;
          const it = document.createElement('div');
          it.className = 'city-picker-item';
          // 如果是车站/机场模式，显示名字，并在旁边用小字显示城市名
          if (mode === 'station' || mode === 'airport') {
            it.innerHTML = `<span>${item}</span> <span style="font-size:12px;color:#94a3b8;float:right;">${city}</span>`;
          } else {
            it.textContent = city;
          }
          
          it.addEventListener('click', () => {
            const val = (mode === 'city') ? city : item;
            input.value = val;
            panel.style.display = 'none';
            if (onPick) onPick(val);
          });
          listBox.appendChild(it);
        });
      });
    });

    if (!hasMatch) {
      const empty = document.createElement('div');
      empty.style.padding = '16px';
      empty.style.color = '#94a3b8';
      empty.style.fontSize = '13px';
      empty.style.textAlign = 'center';
      empty.textContent = '没有匹配结果';
      listBox.appendChild(empty);
    }
  }

  // 事件绑定
  search.addEventListener('input', (e) => rebuild(e.target.value));
  
  input.addEventListener('focus', () => {
    panel.style.display = 'block';
    rebuild(search.value);
    setTimeout(() => search.focus(), 50);
  });
  
  input.addEventListener('click', () => {
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      rebuild(search.value);
      setTimeout(() => search.focus(), 50);
    } else {
      panel.style.display = 'none';
    }
  });

  // 点击外部关闭
  const onDocClick = (e) => {
    if (!wrap.contains(e.target)) {
      panel.style.display = 'none';
    }
  };
  document.addEventListener('click', onDocClick);

  wrap.appendChild(panel);
  return wrap;
}

          };
          state.view = 'pay';
          draw();
        });

        return el;
      }

      // 初始绘制
      draw();
      return root;
    }
  };
}

            state.payMethod = 'wallet';
            draw();
          });
        }
        methodsBox.appendChild(walletCard);

        // 2. 银行卡列表
        const cards = BankCards.list();
        cards.forEach(card => {
          const cardEnough = card.balance >= amount;
          const cardSelected = state.payMethod === card.id;
          
          const cEl = document.createElement('div');
          cEl.className = `card clickable ${cardSelected ? 'selected' : ''}`;
          cEl.style.cssText = `display:flex;justify-content:space-between;align-items:center;${!cardEnough ? 'opacity:0.5;pointer-events:none;' : ''}`;
          
          // 运营商图标文字
          const networkText = { visa: 'VISA', mastercard: 'MasterCard', unionpay: '银联', other: '其他' }[card.network] || '其他';
          const maskNo = card.cardNo.replace(/.(?=.{4})/g, '*');
          
          cEl.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="color:${cardSelected ? 'var(--primary)' : '#64748b'}">${icon('credit-card', 24)}</div>
              <div>
                <div style="font-weight:600;font-size:15px;">${card.bankName} <span style="font-size:11px;color:#fff;background:#475569;padding:1px 6px;border-radius:4px;margin-left:4px;">${networkText}</span></div>
                <div class="card-sub">${maskNo} · 余额 ¥${card.balance} ${!cardEnough ? '(不足)' : ''}</div>
              </div>
            </div>
            <div style="width:20px;height:20px;border-radius:50%;border:2px solid ${cardSelected ? 'var(--primary)' : '#cbd5e1'};background:${cardSelected ? 'var(--primary)' : 'transparent'};display:grid;place-items:center;">
              ${cardSelected ? `<div style="width:8px;height:8px;background:#fff;border-radius:50%;"></div>` : ''}
            </div>
          `;
          
          if (cardEnough) {
            cEl.addEventListener('click', () => {
              if (state.isPaying) return;
              state.payMethod = card.id;
              draw();
            });
          }
          methodsBox.appendChild(cEl);
        });

        el.appendChild(methodsBox);

        // 支付按钮
        const payBtn = document.createElement('button');
        payBtn.className = 'btn block';
        payBtn.style.marginTop = '20px';
        payBtn.textContent = state.isPaying ? '正在处理...' : `确认支付 ¥${amount}`;
        if (state.isPaying) payBtn.disabled = true;
        
        payBtn.addEventListener('click', async () => {
          if (state.isPaying) return;
          state.isPaying = true;
          payBtn.textContent = '正在处理...';
          payBtn.disabled = true;

          // 模拟网络延迟
          await new Promise(r => setTimeout(r, 800));

          let result;
          if (state.payMethod === 'wallet') {
            result = Wallet.pay(amount);
          } else {
            result = BankCards.pay(state.payMethod, amount);
          }

          if (!result.ok) {
            Shell.notify(result.reason);
            state.isPaying = false;
            payBtn.textContent = `确认支付 ¥${amount}`;
            payBtn.disabled = false;
            return;
          }

          // 支付成功
          state.order.status = 'issued';
          Orders.add(state.order);
          state.isPaying = false;
          state.view = 'done';
          draw();
          Shell.notify('支付成功');
        });
        
        el.appendChild(payBtn);

        return el;
      }

      /* ---------- 6. 成功页 ---------- */
      function renderDone() {
        const el = document.createElement('div');
        el.style.cssText = 'text-align:center;padding:60px 20px;';
        
        el.innerHTML = `
          <div style="color:#16a34a;margin-bottom:20px;display:flex;justify-content:center;">${icon('check', 72)}</div>
          <h2 style="justify-content:center;color:#0f172a;">预订成功</h2>
          <div class="card-sub" style="margin-bottom:30px;font-size:15px;">${state.order.title}</div>
          
          <div class="card" style="text-align:left;">
            <div class="row"><span>订单号</span><span class="muted">${state.order.id}</span></div>
            <div class="row"><span>实付金额</span><span class="price">¥${state.order.amount}</span></div>
          </div>
          
          <div class="btn-row" style="margin-top:20px;">
            <button class="btn secondary" id="close-btn">返回首页</button>
            <button class="btn" id="view-order-btn">查看订单</button>
          </div>
        `;

        el.querySelector('#close-btn').addEventListener('click', () => {
          Shell.closeApp(cfg.id);
        });
        
        el.querySelector('#view-order-btn').addEventListener('click', () => {
          Shell.openApp('orders');
          // 如果是在手机端，可以考虑关闭当前 App 页面（但用 openApp 压栈也是合理的）
        });

        return el;
      }

      draw();
      return root;
    }
  };
}
</script>
<script>
/* ==========================================================================
   15. WalletOS (钱包 App)
   包含余额、我的卡包、添加/编辑银行卡、云端同步入口
   ========================================================================== */
window.WalletApp = {
  render() {
    const root = document.createElement('div');
    root.className = 'app';

    const state = {
      view: 'home', // home | cards | add_card | edit_card
      editingCardId: null
    };

    function draw() {
      root.innerHTML = '';
      const views = {
        home: renderHome,
        cards: renderCards,
        add_card: () => renderCardForm(null),
        edit_card: () => renderCardForm(state.editingCardId)
      };
      root.appendChild(views[state.view]());
    }

    /* ---------- 1. 钱包首页 ---------- */
    function renderHome() {
      const el = document.createElement('div');
      const balance = Wallet.getBalance();
      const cards = BankCards.list();

      el.innerHTML = `
        <h2>WalletOS</h2>
        <div class="card" style="text-align:center;padding:30px 20px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;border:none;border-radius:16px;box-shadow:0 10px 30px rgba(37,99,235,0.3);">
          <div style="font-size:14px;opacity:0.8;margin-bottom:6px;">钱包总余额</div>
          <div style="font-size:40px;font-weight:700;">¥${balance.toFixed(2)}</div>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;">
            <button class="btn small" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);" id="recharge-btn">${icon('plus', 14)} 充值</button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;margin-bottom:12px;">
          <h3 style="margin:0;">我的卡包 (${cards.length})</h3>
          <button class="btn small secondary" id="view-cards-btn">管理卡包 ${icon('chevron-right', 14)}</button>
        </div>
        <div id="home-cards-preview" style="display:flex;overflow-x:auto;gap:12px;padding-bottom:10px;"></div>

        <div class="card" style="margin-top:24px;">
          <div class="card-title">${icon('cloud', 18)} 云同步</div>
          <div class="card-sub">当前同步码：${Store.get('sync_code', '未设置')}</div>
          <button class="btn small secondary" style="margin-top:10px;" id="settings-sync-btn">去设置</button>
        </div>
      `;

      // 充值功能
      el.querySelector('#recharge-btn').addEventListener('click', () => {
        Wallet.setBalance(balance + 1000);
        Shell.notify('充值成功 +¥1000');
        draw();
      });

      // 进入卡包管理
      el.querySelector('#view-cards-btn').addEventListener('click', () => {
        state.view = 'cards';
        draw();
      });

      // 去设置同步
      el.querySelector('#settings-sync-btn').addEventListener('click', () => {
        Shell.openApp('settings');
      });

      // 首页卡包预览（只展示前两张）
      const previewBox = el.querySelector('#home-cards-preview');
      if (cards.length === 0) {
        previewBox.innerHTML = `<div class="card-sub" style="color:#94a3b8;padding:10px;">暂无银行卡，点击“管理卡包”添加。</div>`;
      } else {
        cards.slice(0, 2).forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.style.cssText = 'min-width:200px;flex-shrink:0;';
          const networkText = { visa: 'VISA', mastercard: 'MasterCard', unionpay: '银联', other: '其他' }[card.network] || '其他';
          const maskNo = card.cardNo.replace(/.(?=.{4})/g, '*');
          cardEl.innerHTML = `
            <div class="bank-card ${card.bgClass}" style="height:120px;padding:14px;border-radius:12px;">
              <div class="bank-card-top">
                <span class="bank-card-bank" style="font-size:13px;">${card.bankName}</span>
                <span class="bank-card-network" style="font-size:10px;">${networkText}</span>
              </div>
              <div class="bank-card-number" style="font-size:14px;margin-top:8px;">${maskNo}</div>
              <div class="bank-card-bottom" style="margin-top:8px;">
                <div><div class="label" style="font-size:8px;">余额</div><div class="value" style="font-size:12px;">¥${card.balance}</div></div>
              </div>
            </div>
          `;
          previewBox.appendChild(cardEl);
        });
      }

      return el;
    }

    /* ---------- 2. 卡包管理列表 ---------- */
    function renderCards() {
      const el = document.createElement('div');
      const cards = BankCards.list();

      const header = document.createElement('div');
      header.className = 'header-bar';
      header.innerHTML = `
        <button class="btn secondary small" id="back-btn">${icon('arrow-left', 18)}</button>
        <div class="title">我的卡包</div>
      `;
      header.querySelector('#back-btn').addEventListener('click', () => { state.view = 'home'; draw(); });
      el.appendChild(header);

      if (cards.length === 0) {
        el.innerHTML += `<div class="empty">${icon('credit-card', 48)}<br>还没有添加银行卡</div>`;
      } else {
        cards.forEach(card => {
          const networkText = { visa: 'VISA', mastercard: 'MasterCard', unionpay: '银联', other: '其他' }[card.network] || '其他';
          const maskNo = card.cardNo.replace(/.(?=.{4})/g, '*');
          
          const item = document.createElement('div');
          item.className = 'bank-card-item';
          item.innerHTML = `
            <div class="bank-card-item-left">
              <div class="bank-card-icon">${icon('credit-card', 22)}</div>
              <div>
                <div class="bank-card-item-title">${card.bankName} <span style="font-size:11px;background:#e2e8f0;padding:2px 6px;border-radius:4px;margin-left:4px;">${networkText}</span></div>
                <div class="bank-card-item-sub">${maskNo}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div class="price" style="font-size:16px;margin-bottom:4px;">¥${card.balance}</div>
              <div style="font-size:12px;color:var(--text-sub);">点击编辑</div>
            </div>
          `;
          item.addEventListener('click', () => {
            state.editingCardId = card.id;
            state.view = 'edit_card';
            draw();
          });
          el.appendChild(item);
        });
      }

      // 添加按钮
      const addBtn = document.createElement('button');
      addBtn.className = 'btn block';
      addBtn.style.marginTop = '16px';
      addBtn.innerHTML = `${icon('plus', 18)} 添加新银行卡`;
      addBtn.addEventListener('click', () => {
        state.view = 'add_card';
        draw();
      });
      el.appendChild(addBtn);

      return el;
    }

    /* ---------- 3. 添加/编辑银行卡表单 ---------- */
    function renderCardForm(cardId) {
      const isEdit = !!cardId;
      const existingCard = isEdit ? BankCards.get(cardId) : null;
      
      if (isEdit && !existingCard) {
        state.view = 'cards';
        draw();
        return document.createElement('div');
      }

      const el = document.createElement('div');
      
      const header = document.createElement('div');
      header.className = 'header-bar';
      header.innerHTML = `
        <button class="btn secondary small" id="back-btn">${icon('arrow-left', 18)}</button>
        <div class="title">${isEdit ? '编辑银行卡' : '添加银行卡'}</div>
      `;
      header.querySelector('#back-btn').addEventListener('click', () => { 
        state.view = 'cards'; 
        draw(); 
      });
      el.appendChild(header);

      // 银行列表
      const banks = ['工商银行', '建设银行', '农业银行', '中国银行', '交通银行', '招商银行', '浦发银行', '民生银行', '兴业银行', '中信银行', '光大银行', '平安银行', '广发银行', '华夏银行', '邮储银行', '其他银行'];

      el.innerHTML += `
        <div class="field">
          <label>银行名称</label>
          <select id="bank-name">
            <option value="">请选择银行</option>
            ${banks.map(b => `<option value="${b}" ${existingCard && existingCard.bankName === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>银行卡号</label>
          <input id="card-no" type="text" placeholder="请输入16-19位卡号" value="${existingCard ? existingCard.cardNo : ''}" maxlength="19">
        </div>
        <div class="field">
          <label>运营商</label>
          <select id="network">
            <option value="unionpay" ${existingCard && existingCard.network === 'unionpay' ? 'selected' : ''}>UnionPay (银联)</option>
            <option value="visa" ${existingCard && existingCard.network === 'visa' ? 'selected' : ''}>Visa</option>
            <option value="mastercard" ${existingCard && existingCard.network === 'mastercard' ? 'selected' : ''}>MasterCard (万事达)</option>
            <option value="other" ${existingCard && existingCard.network === 'other' ? 'selected' : ''}>其他</option>
          </select>
        </div>
        <div class="field">
          <label>卡内金额 (¥)</label>
          <input id="balance" type="number" placeholder="请输入余额" value="${existingCard ? existingCard.balance : '1000'}" min="0" step="100">
        </div>
        
        <div id="preview-box" style="margin:20px 0;"></div>

        <button class="btn block" id="save-btn" style="margin-top:10px;">${isEdit ? '保存修改' : '确认添加'}</button>
        ${isEdit ? `<button class="btn block danger" id="delete-btn" style="margin-top:10px;">删除此卡</button>` : ''}
      `;

      // 实时预览卡面
      const previewBox = el.querySelector('#preview-box');
      const bankSel = el.querySelector('#bank-name');
      const noInput = el.querySelector('#card-no');
      const netSel = el.querySelector('#network');
      const balInput = el.querySelector('#balance');

      function updatePreview() {
        const bank = bankSel.value || '银行名称';
        const no = noInput.value || '**** **** **** ****';
        const net = netSel.value;
        const bal = balInput.value || '0';
        const netText = { visa: 'VISA', mastercard: 'MasterCard', unionpay: '银联', other: '其他' }[net] || '其他';
        const bgClass = existingCard ? existingCard.bgClass : 'bg-0';
        const maskNo = no.replace(/.(?=.{4})/g, '*');

        previewBox.innerHTML = `
          <div class="bank-card ${bgClass}" style="height:160px;">
            <div class="bank-card-top">
              <span class="bank-card-bank">${bank}</span>
              <span class="bank-card-network">${netText}</span>
            </div>
            <div class="bank-card-chip"></div>
            <div class="bank-card-number">${maskNo}</div>
            <div class="bank-card-bottom">
              <div><div class="label">余额</div><div class="value">¥${bal}</div></div>
            </div>
          </div>
        `;
      }

      bankSel.addEventListener('change', updatePreview);
      noInput.addEventListener('input', updatePreview);
      netSel.addEventListener('change', updatePreview);
      balInput.addEventListener('input', updatePreview);
      updatePreview();

      // 保存
      el.querySelector('#save-btn').addEventListener('click', () => {
        const bankName = bankSel.value;
        const cardNo = noInput.value.replace(/\s/g, '');
        const network = netSel.value;
        const balance = parseFloat(balInput.value) || 0;

        if (!bankName) { Shell.notify('请选择银行'); return; }
        if (cardNo.length < 12) { Shell.notify('请输入正确的卡号'); return; }

        if (isEdit) {
          BankCards.update(cardId, { bankName, cardNo, network, balance });
          Shell.notify('修改成功');
        } else {
          BankCards.add({ bankName, cardNo, network, balance });
          Shell.notify('添加成功');
        }
        state.view = 'cards';
        draw();
      });

      // 删除
      if (isEdit) {
        el.querySelector('#delete-btn').addEventListener('click', () => {
          if (confirm(`确定删除尾号 ${existingCard.cardNo.slice(-4)} 的银行卡吗？`)) {
            BankCards.remove(cardId);
            Shell.notify('已删除');
            state.view = 'cards';
            draw();
          }
        });
      }

      return el;
    }

    draw();
    return root;
  }
};
</script>

<script>
/* ==========================================================================
   19. 全局工具：模态框 (Modal)
   ========================================================================== */
window.openModal = function(content) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const box = document.createElement('div');
  box.className = 'modal-box';
  box.appendChild(content);
  mask.appendChild(box);
  mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
  document.body.appendChild(mask);
  return mask;
};

/* ==========================================================================
   21. 地图 App (MapApp)
   根据已出票的订单生成简单的网格地图与行程点
   ========================================================================== */
window.MapApp = {
  render() {
    const el = document.createElement('div');
    el.className = 'app';
    const orders = Orders.list().filter(o => o.status === 'issued');
    
    el.innerHTML = `<h2>地图</h2>`;

    // 绘制简单网格背景
    const mapDiv = document.createElement('div');
    mapDiv.className = 'map-grid';
    
    const seed = hash(orders.map(o => o.subtitle).join('') || 'default');
    const spots = 5 + (seed % 4);
    
    // 随机打点
    for (let i = 0; i < spots; i++) {
      const pin = document.createElement('div');
      pin.className = 'map-pin';
      pin.style.left = (10 + ((seed + i * 37) % 80)) + '%';
      pin.style.top = (10 + ((seed + i * 53) % 70)) + '%';
      // 加一点动画延迟
      pin.style.animation = `pulseGlow 2s infinite ${i * 0.2}s`;
      mapDiv.appendChild(pin);
    }
    el.appendChild(mapDiv);

    if (!orders.length) {
      el.innerHTML += '<div class="empty">还没有已出票的行程，去订一张吧</div>';
      return el;
    }

    // 行程目的地卡片
    const card = document.createElement('div');
    card.className = 'card';
    
    // 提取目的地（简单的字符串处理，取 → 后面的部分）
    const destinations = orders.map(o => {
      if (o.subtitle && o.subtitle.includes('→')) {
        return o.subtitle.split('→')[1].trim();
      }
      return o.subtitle;
    });

    card.innerHTML = `
      <div class="card-title">${icon('map-pin', 18)} 我的行程目的地</div>
      <div class="chip-row" style="margin-top:12px;">
        ${destinations.map(d => `<span class="chip">${d}</span>`).join('')}
      </div>
    `;
    el.appendChild(card);

    return el;
  }
};

   23. 便签 App (NotesApp)
   简单的文本备忘录
   ========================================================================== */
window.NotesApp = {
  list() { return Store.get('notes', []); },
  set(l) { Store.set('notes', l); maybeAutoSync(); },
  
  render() {
    const el = document.createElement('div');
    el.className = 'app';
    
    el.innerHTML = `
      <h2>便签</h2>
      <div class="field">
        <input id="note-input" placeholder="写点什么..." style="height:48px;">
      </div>
      <button class="btn block" id="add-btn">${icon('plus', 18)} 添加便签</button>
      <div id="notes-list" style="margin-top:20px;"></div>
    `;

    // 添加便签
    el.querySelector('#add-btn').addEventListener('click', () => {
      const input = el.querySelector('#note-input');
      const v = input.value.trim();
      if (!v) return;
      
      const list = this.list();
      list.unshift({ id: 'n' + Date.now(), text: v, createdAt: Date.now() });
      this.set(list);
      input.value = '';
      Shell.refresh('notes');
    });

    // 渲染列表
    const list = this.list();
    const box = el.querySelector('#notes-list');
    
    if (!list.length) {
      box.innerHTML = '<div class="empty" style="padding:20px 0;">暂无便签</div>';

    list.forEach(n => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = 'background:#fefce8;border-color:#fef08a;'; // 便签黄
      
      const timeStr = new Date(n.createdAt).toLocaleString('zh-CN', { hour12: false });
      
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div style="font-size:14px;color:#854d0e;line-height:1.5;">${n.text}</div>

        </div>
        <div style="font-size:11px;color:#a16207;margin-top:8px;">${timeStr}</div>

      card.querySelector('[data-del]').addEventListener('click', () => {

        Shell.refresh('notes');
      });
      
      box.appendChild(card);
    });

    return el;
  }
};

/* ==========================================================================
   24. 设置 App (SettingsApp)
   包含云同步（同步码设置、上传、拉取）与数据清理
   ========================================================================== */
window.SettingsApp = {
  render() {
    const el = document.createElement('div');
    el.className = 'app';
    
    const currentCode = Store.get('sync_code', '');
    const cardsCount = BankCards.list().length;

    el.innerHTML = `
      <h2>设置</h2>
      
      <!-- 云同步区块 -->
      <div class="card">
        <div class="card-title">${icon('cloud', 18)} 云同步 (Netlify Blobs)</div>
        <div class="card-sub" style="margin-bottom:12px;">
          设置一个 4-20 位的字母或数字作为同步码。在其他设备输入相同同步码，即可同步订单、银行卡、乘客等数据。
        </div>
        
        <div class="field">
          <label>同步码</label>
          <input id="sync-code" type="text" value="${currentCode}" placeholder="例如: abcd1234" maxlength="20">
        </div>
        
        <div class="btn-row">
          <button class="btn" id="save-sync">${icon('check', 16)} 保存并上传</button>
          <button class="btn secondary" id="pull-sync">${icon('refresh-cw', 16)} 从云端拉取</button>
        </div>
        <div id="sync-status" style="margin-top:10px;font-size:13px;color:var(--text-sub);"></div>
      </div>

      <!-- 数据总览 -->
      <div class="card">
        <div class="card-title">数据概览</div>
        <div class="row"><span>订单数量</span><span>${Orders.list().length} 个</span></div>
        <div class="row"><span>消息数量</span><span>${Messages.list().length} 条</span></div>
        <div class="row"><span>银行卡数量</span><span>${cardsCount} 张</span></div>
      </div>

      <!-- 危险区域 -->
      <div class="card" style="border-color:#fecaca;">
        <div class="card-title" style="color:#dc2626;">危险区域</div>
        <div class="card-sub" style="margin-bottom:12px;">
          清除所有数据（订单、消息、余额、银行卡、便签等），此操作不可恢复。
        </div>
        <button class="btn block danger" id="clear-data">清除全部数据</button>
      </div>

      <!-- 关于 -->
      <div class="card">
        <div class="card-title">关于</div>
        <div class="card-sub">
          TravelOS 模拟操作系统<br>
          版本：2.0 (Netlify Edition)<br>
          本地数据保存在浏览器，跨设备同步使用 Netlify Blobs。
        </div>
      </div>
    `;

    const syncCodeInput = el.querySelector('#sync-code');
    const syncStatus = el.querySelector('#sync-status');
    const saveBtn = el.querySelector('#save-sync');
    const pullBtn = el.querySelector('#pull-sync');

    // 保存并上传
    saveBtn.addEventListener('click', async () => {
      const code = syncCodeInput.value.trim();
      if (!/^[A-Za-z0-9]{4,20}$/.test(code)) {
        Shell.notify('同步码必须是 4-20 位字母或数字');
        return;
      }
      
      saveBtn.disabled = true;
      syncStatus.innerHTML = '正在上传...';
      
      try {
        SyncEngine.setSyncCode(code);
        await SyncEngine.pushToCloud();
        syncStatus.innerHTML = '<span style="color:#16a34a">✓ 同步码已保存并上传至云端</span>';
        Shell.notify('同步成功');
      } catch (e) {
        syncStatus.innerHTML = `<span style="color:#dc2626">✗ ${e.message}</span>`;
        // 回滚同步码（如果上传失败，可以考虑保留，但为了严谨，这里不强制回滚）
      } finally {
        saveBtn.disabled = false;
      }
    });

    // 从云端拉取
    pullBtn.addEventListener('click', async () => {
      const code = syncCodeInput.value.trim();
      if (!/^[A-Za-z0-9]{4,20}$/.test(code)) {
        Shell.notify('请输入有效的同步码');
        return;
      }
      
      if (!confirm('确定用云端数据覆盖当前本地数据吗？')) return;

      pullBtn.disabled = true;
      syncStatus.innerHTML = '正在拉取...';
      
      try {
        await SyncEngine.pullFromCloud(code);
        syncStatus.innerHTML = '<span style="color:#16a34a">✓ 数据已从云端恢复</span>';
        Shell.notify('拉取成功');
        
        // 刷新当前页面和其他页面
        setTimeout(() => {
          Shell.refresh('settings');
          // 如果用户开着其他App，最好也能刷新，但这里为了简单，仅刷新设置页
        }, 500);
      } catch (e) {
        syncStatus.innerHTML = `<span style="color:#dc2626">✗ ${e.message}</span>`;
      } finally {
        pullBtn.disabled = false;
      }
    });

    // 清除数据
    el.querySelector('#clear-data').addEventListener('click', () => {
      if (confirm('⚠️ 确定清除所有本地数据吗？此操作不可恢复！')) {
        Store.clearAll();
        Shell.notify('数据已清除');
        // 刷新所有可能受影响的页面
        ['settings', 'orders', 'wallet', 'messages', 'profile'].forEach(id => Shell.refresh(id));
      }
    });

    return el;
  }
};
